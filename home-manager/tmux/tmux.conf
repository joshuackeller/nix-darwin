# Reload Config Shortcut
unbind r
bind r source-file ~/.tmux.conf

# Ensure window index numbers get reordered on delete
set-option -g renumber-windows on

# Move tmux bar to top
set-option -g status-position top

############# SMART PANE SWITCHING ##########
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -n 'C-Left' if-shell "$is_vim" 'send-keys C-Left' 'select-pane -L'
bind-key -n 'C-Down' if-shell "$is_vim" 'send-keys C-Down' 'select-pane -D'
bind-key -n 'C-Up' if-shell "$is_vim" 'send-keys C-Up' 'select-pane -U'
bind-key -n 'C-Right' if-shell "$is_vim" 'send-keys C-Right' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-Left' select-pane -L
bind-key -T copy-mode-vi 'C-Down' select-pane -D
bind-key -T copy-mode-vi 'C-Up' select-pane -U
bind-key -T copy-mode-vi 'C-Right' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+
########## END SMART PANE SWITCHING ###########

############# START THEME ##############
set-option -g status "on"
set-option -g status-style bg=colour235,fg=colour223
set-window-option -g window-status-style bg=colour75,fg=colour188
set-window-option -g window-status-activity-style bg=colour235,fg=colour248
set-window-option -g window-status-current-style bg=red,fg=colour188
set-option -g pane-active-border-style fg=colour250
set-option -g pane-border-style fg=colour235
set-option -g message-style bg=colour236,fg=colour188
set-option -g message-command-style bg=colour235,fg=colour188
set-option -g display-panes-active-colour colour250
set-option -g display-panes-colour colour235
set-window-option -g clock-mode-colour colour109
set-window-option -g window-status-bell-style bg=colour236,fg=colour235
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""
set-option -g status-left "#[bg=colour236,fg=colour188] #S #[bg=colour235,fg=colour188,nobold,noitalics,nounderscore] "
set-option -g status-right ""
set-window-option -g window-status-current-format "#[bg=colour75,fg=colour236,nobold,noitalics,nounderscore] #[bg=colour75,fg=colour236,bold] #W#{?window_zoomed_flag,*Z,} | #[bg=colour75,fg=colour236]#I #[bg=colour235,fg=colour75,nobold,noitalics,nounderscore] "
set-window-option -g window-status-format "#[bg=colour236,fg=colour188,noitalics] #[bg=colour236,fg=colour188] #W | #[bg=colour236,fg=colour188]#I #[bg=colour235,fg=colour188,noitalics] "
############## END THEME ###############
